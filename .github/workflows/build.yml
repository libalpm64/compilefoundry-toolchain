name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to build and publish (created if not exists)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: toolchain-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential cmake curl git ninja-build python3
      - run: git clone --depth 1 --branch 6.0.8 https://github.com/emscripten-core/emsdk.git emsdk
      - run: ./emsdk/emsdk install 6.0.8
      - run: ./emsdk/emsdk activate 6.0.8
      - run: source emsdk/emsdk_env.sh && bash scripts/build.sh
      - run: source emsdk/emsdk_env.sh && node scripts/smoke.mjs
      - run: rm dist/clang.wasm dist/lld.wasm dist/sysroot-base.tar dist/sysroot-threads.tar
      - uses: actions/upload-artifact@v4
        with:
          name: compilefoundry-toolchain
          path: dist/
          if-no-files-found: error

  go-yaegi:
    name: Go 1.26 Yaegi WASI (unified)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build Yaegi WASI (GOOS=wasip1)
        run: |
          set -e
          mkdir -p /tmp/yaegi && cd /tmp/yaegi
          go mod init yaegi-wasm
          go get github.com/traefik/yaegi@v0.16.2-0.20260209085605-fcb76d1ece0c
          cat > main.go <<'GO'
          package main
          import (
            "fmt"
            "io"
            "os"
            "strings"
            "github.com/traefik/yaegi/interp"
            "github.com/traefik/yaegi/stdlib"
          )
          func main(){
            var src string
            if b,err:=os.ReadFile("/tmp/main.go"); err==nil && len(b)>0 { src=string(b) } else if b,err:=io.ReadAll(os.Stdin); err==nil && len(strings.TrimSpace(string(b)))>0 { src=string(b) } else if len(os.Args)>1 { if b,err:=os.ReadFile(os.Args[1]); err==nil { src=string(b)} else {src=os.Args[1]} }
            if strings.TrimSpace(src)=="" { fmt.Fprintln(os.Stderr,"yaegi: no source"); os.Exit(1) }
            i:=interp.New(interp.Options{}); i.Use(stdlib.Symbols)
            if _,err:=i.Eval(src); err!=nil { fmt.Fprintln(os.Stderr, strings.TrimSpace(err.Error())); os.Exit(1) }
          }
          GO
          GOOS=wasip1 GOARCH=wasm go build -o yaegi.wasm .
          ls -lh yaegi.wasm
          gzip -c yaegi.wasm > yaegi.wasm.gz
          mkdir -p $GITHUB_WORKSPACE/dist
          cp yaegi.wasm yaegi.wasm.gz $GITHUB_WORKSPACE/dist/
          echo "yaegi WASI unified ok"
          # symlink for unified toolchain: yaegi -> go toolchain
          ln -s yaegi.wasm $GITHUB_WORKSPACE/dist/go.wasm || true
          ls -lh $GITHUB_WORKSPACE/dist/yaegi*
      - uses: actions/upload-artifact@v4
        with:
          name: yaegi-wasi
          path: dist/yaegi.wasm*
          if-no-files-found: error

  rust-wasi:
    name: Rust 1.88 WASI 0.3 (unified)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown
      - name: Verify Rust WASI 0.3
        run: |
          set -e
          rustc --version; cargo --version
          rustup target list --installed | grep wasm32-wasip2
          TMP=$(mktemp -d)
          cargo new --bin "$TMP/rust-wasi-test" --vcs none
          cat > "$TMP/rust-wasi-test/src/main.rs" <<'RS'
          fn main(){ println!("Hello Rust via WASI 0.3"); }
          RS
          cd "$TMP/rust-wasi-test"
          cargo build --target wasm32-wasip1 --release
          cargo build --target wasm32-wasip2 --release
          ls -lh target/wasm32-wasip*/release/rust-wasi-test.wasm
          echo "rust WASI unified ok"
          mkdir -p $GITHUB_WORKSPACE/dist
          cp target/wasm32-wasip2/release/rust-wasi-test.wasm $GITHUB_WORKSPACE/dist/rust-wasi-test.wasm || true
          # pack sysroot for browser (future rustc.wasm)
          SYSROOT=$(rustc --print sysroot)
          tar czf $GITHUB_WORKSPACE/dist/rust-sysroot-wasip2.tar.gz -C "$SYSROOT/lib/rustlib" wasm32-wasip2 2>/dev/null || tar czf $GITHUB_WORKSPACE/dist/rust-sysroot-wasip2.tar.gz -C "$SYSROOT" lib/rustlib/wasm32-wasip2 2>/dev/null || echo "sysroot pack skipped"
          ls -lh $GITHUB_WORKSPACE/dist/rust* || true
      - uses: actions/upload-artifact@v4
        with:
          name: rust-wasi
          path: dist/rust*
          if-no-files-found: warn

  release:
    if: inputs.release_tag != ''
    needs: [build, go-yaegi, rust-wasi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
      - run: ls -R dist-all; echo "---"; find dist-all -type f | head -n 20
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          git fetch --tags || true
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG" || true
            git push origin "$RELEASE_TAG" || true
          fi
          gh release create "$RELEASE_TAG" dist-all/**/* --generate-notes --fail-on-no-artifacts || gh release upload "$RELEASE_TAG" dist-all/**/* --clobber
