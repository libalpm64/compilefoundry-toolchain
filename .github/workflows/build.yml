name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential cmake curl git ninja-build python3
      - run: git clone --depth 1 --branch 6.0.8 https://github.com/emscripten-core/emsdk.git emsdk
      - run: ./emsdk/emsdk install 6.0.8
      - run: ./emsdk/emsdk activate 6.0.8
      - run: source emsdk/emsdk_env.sh && bash scripts/build.sh
      - run: source emsdk/emsdk_env.sh && node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: compilefoundry-toolchain
          path: dist/
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
