name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: toolchain-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential cmake curl git ninja-build python3
      - run: git clone --depth 1 --branch 6.0.8 https://github.com/emscripten-core/emsdk.git emsdk
      - run: ./emsdk/emsdk install 6.0.8
      - run: ./emsdk/emsdk activate 6.0.8
      - run: source emsdk/emsdk_env.sh && bash scripts/build.sh
      - run: source emsdk/emsdk_env.sh && node scripts/smoke.mjs
      - run: rm dist/clang.wasm dist/lld.wasm dist/sysroot-base.tar dist/sysroot-threads.tar
      - uses: actions/upload-artifact@v4
        with:
          name: compilefoundry-toolchain
          path: dist/
          if-no-files-found: error
      - if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
